# nFPM configuration for deb and rpm packages (tech-stack.md, ADR-0015).
# Driven by Taskfile.yml (task package), which sets GOARCH and VERSION.
name: meiscope-collector
arch: ${GOARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: net
priority: optional
# PLACEHOLDER contact address (.invalid): replace when the project mailbox exists.
maintainer: UVAMAI <maintainers@uvamai.invalid>
description: |
  Meiscope collector: outbound-only TLS probe and adapter runner.
  Sends public certificates and their bindings to the Meiscope core;
  never sends private keys or credentials.
vendor: UVAMAI
homepage: https://github.com/uvamai/meiscope-collector
license: Apache-2.0

contents:
  # nFPM does not expand variables in src; task package stages the binary for
  # the current GOARCH here before each run.
  - src: dist/.stage/meiscope-collector
    dst: /usr/bin/meiscope-collector
    file_info:
      mode: 0755
  - src: packaging/systemd/meiscope-collector.service
    dst: /usr/lib/systemd/system/meiscope-collector.service
    file_info:
      mode: 0644
  - src: packaging/collector.env
    dst: /etc/meiscope-collector/collector.env
    type: config|noreplace
    file_info:
      mode: 0640
  - src: LICENSE
    dst: /usr/share/doc/meiscope-collector/LICENSE
    file_info:
      mode: 0644
  - src: NOTICE
    dst: /usr/share/doc/meiscope-collector/NOTICE
    file_info:
      mode: 0644
