{
  "version": "5.0.0",
  "discovery": [],
  "queries": {
    "meiscope_certificates_posix": {
      "query": "SELECT common_name, subject, issuer, ca, self_signed, not_valid_before, not_valid_after, signing_algorithm, key_algorithm, key_strength, subject_key_id, authority_key_id, sha1, path, serial FROM certificates;",
      "interval": 86400,
      "platform": "posix",
      "snapshot": true,
      "description": "Meiscope: certificate metadata from the system trust stores and keychains (no private keys, no certificate bodies)."
    },
    "meiscope_certificates_windows": {
      "query": "SELECT common_name, subject, issuer, ca, self_signed, not_valid_before, not_valid_after, signing_algorithm, key_algorithm, key_strength, subject_key_id, authority_key_id, sha1, path, serial, sid, store_location, store, username, store_id FROM certificates;",
      "interval": 86400,
      "platform": "windows",
      "snapshot": true,
      "description": "Meiscope: certificate metadata from every Windows store, including per-user stores (no private keys, no certificate bodies)."
    },
    "meiscope_keystore_counts_posix": {
      "query": "SELECT COALESCE(SUM(CASE WHEN (f.path LIKE '/etc/ssl/certs/%' OR f.path LIKE '/etc/pki/ca-trust/extracted/%' OR f.path LIKE '/var/lib/docker/%' OR f.path LIKE '/var/lib/containerd/%' OR f.path LIKE '/var/lib/containers/%' OR f.path LIKE '/var/lib/kubelet/pods/%' OR f.path LIKE '/run/containerd/%' OR f.path LIKE '/opt/containerd/%') THEN 1 ELSE 0 END), 0) AS excluded, COALESCE(SUM(CASE WHEN NOT (f.path LIKE '/etc/ssl/certs/%' OR f.path LIKE '/etc/pki/ca-trust/extracted/%' OR f.path LIKE '/var/lib/docker/%' OR f.path LIKE '/var/lib/containerd/%' OR f.path LIKE '/var/lib/containers/%' OR f.path LIKE '/var/lib/kubelet/pods/%' OR f.path LIKE '/run/containerd/%' OR f.path LIKE '/opt/containerd/%') AND f.size > 10485760 THEN 1 ELSE 0 END), 0) AS oversize, COALESCE(SUM(CASE WHEN NOT (f.path LIKE '/etc/ssl/certs/%' OR f.path LIKE '/etc/pki/ca-trust/extracted/%' OR f.path LIKE '/var/lib/docker/%' OR f.path LIKE '/var/lib/containerd/%' OR f.path LIKE '/var/lib/containers/%' OR f.path LIKE '/var/lib/kubelet/pods/%' OR f.path LIKE '/run/containerd/%' OR f.path LIKE '/opt/containerd/%') AND f.size <= 10485760 THEN 1 ELSE 0 END), 0) AS eligible FROM file f WHERE (f.path LIKE '/etc/%%' OR f.path LIKE '/opt/%%' OR f.path LIKE '/srv/%%' OR f.path LIKE '/usr/local/%%') AND f.type = 'regular' AND (f.filename LIKE '%.jks' OR f.filename LIKE '%.p12' OR f.filename LIKE '%.pfx' OR f.filename LIKE '%.pem' OR f.filename LIKE '%.kdb');",
      "interval": 86400,
      "platform": "posix",
      "snapshot": true,
      "description": "Meiscope: counts of keystore files left out of the keystores query (excluded directories, over the size limit, over the file limit), so every run can report them."
    },
    "meiscope_keystore_counts_windows": {
      "query": "SELECT COALESCE(SUM(CASE WHEN (f.path LIKE 'C:\\ProgramData\\Docker\\%' OR f.path LIKE 'C:\\ProgramData\\containerd\\%' OR f.path LIKE 'C:\\ProgramData\\Microsoft\\%') THEN 1 ELSE 0 END), 0) AS excluded, COALESCE(SUM(CASE WHEN NOT (f.path LIKE 'C:\\ProgramData\\Docker\\%' OR f.path LIKE 'C:\\ProgramData\\containerd\\%' OR f.path LIKE 'C:\\ProgramData\\Microsoft\\%') AND f.size > 10485760 THEN 1 ELSE 0 END), 0) AS oversize, COALESCE(SUM(CASE WHEN NOT (f.path LIKE 'C:\\ProgramData\\Docker\\%' OR f.path LIKE 'C:\\ProgramData\\containerd\\%' OR f.path LIKE 'C:\\ProgramData\\Microsoft\\%') AND f.size <= 10485760 THEN 1 ELSE 0 END), 0) AS eligible FROM file f WHERE (f.path LIKE 'C:\\ProgramData\\%%' OR f.path LIKE 'C:\\inetpub\\%%' OR f.path LIKE 'C:\\Program Files\\%%' OR f.path LIKE 'C:\\Program Files (x86)\\%%') AND f.type = 'regular' AND (f.filename LIKE '%.jks' OR f.filename LIKE '%.p12' OR f.filename LIKE '%.pfx' OR f.filename LIKE '%.pem' OR f.filename LIKE '%.kdb');",
      "interval": 86400,
      "platform": "windows",
      "snapshot": true,
      "description": "Meiscope: counts of keystore files left out of the keystores query (excluded directories, over the size limit, over the file limit), so every run can report them."
    },
    "meiscope_keystores_posix": {
      "query": "SELECT f.path, f.size, f.mtime, f.uid, f.mode, h.sha256 FROM file f JOIN hash h ON h.path = f.path WHERE (f.path LIKE '/etc/%%' OR f.path LIKE '/opt/%%' OR f.path LIKE '/srv/%%' OR f.path LIKE '/usr/local/%%') AND f.path NOT LIKE '/etc/ssl/certs/%' AND f.path NOT LIKE '/etc/pki/ca-trust/extracted/%' AND f.path NOT LIKE '/var/lib/docker/%' AND f.path NOT LIKE '/var/lib/containerd/%' AND f.path NOT LIKE '/var/lib/containers/%' AND f.path NOT LIKE '/var/lib/kubelet/pods/%' AND f.path NOT LIKE '/run/containerd/%' AND f.path NOT LIKE '/opt/containerd/%' AND f.type = 'regular' AND (f.filename LIKE '%.jks' OR f.filename LIKE '%.p12' OR f.filename LIKE '%.pfx' OR f.filename LIKE '%.pem' OR f.filename LIKE '%.kdb') AND f.size <= 10485760 ORDER BY f.path LIMIT 1000;",
      "interval": 86400,
      "platform": "posix",
      "snapshot": true,
      "description": "Meiscope: path, size, mtime, owner, mode and SHA-256 of keystore files (*.jks, *.p12, *.pfx, *.pem, *.kdb). Files up to 10485760 bytes, at most 1000 files; never their contents. System trust-store directories (read by the certificates query) and container root filesystems excluded."
    },
    "meiscope_keystores_windows": {
      "query": "SELECT f.path, f.size, f.mtime, f.uid, f.mode, h.sha256 FROM file f JOIN hash h ON h.path = f.path WHERE (f.path LIKE 'C:\\ProgramData\\%%' OR f.path LIKE 'C:\\inetpub\\%%' OR f.path LIKE 'C:\\Program Files\\%%' OR f.path LIKE 'C:\\Program Files (x86)\\%%') AND f.path NOT LIKE 'C:\\ProgramData\\Docker\\%' AND f.path NOT LIKE 'C:\\ProgramData\\containerd\\%' AND f.path NOT LIKE 'C:\\ProgramData\\Microsoft\\%' AND f.type = 'regular' AND (f.filename LIKE '%.jks' OR f.filename LIKE '%.p12' OR f.filename LIKE '%.pfx' OR f.filename LIKE '%.pem' OR f.filename LIKE '%.kdb') AND f.size <= 10485760 ORDER BY f.path LIMIT 1000;",
      "interval": 86400,
      "platform": "windows",
      "snapshot": true,
      "description": "Meiscope: path, size, mtime, owner, mode and SHA-256 of keystore files (*.jks, *.p12, *.pfx, *.pem, *.kdb). Files up to 10485760 bytes, at most 1000 files; never their contents. Container data directories excluded."
    }
  }
}
