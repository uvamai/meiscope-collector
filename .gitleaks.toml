# Gitleaks configuration. The default rules apply.
# Every exception below combines a path AND a precise regex (condition = "AND")
# and matches the whole line, so it covers one known synthetic test string and
# nothing else. Do not add path-only exceptions, rule-wide exceptions or stopwords.
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic strings in adapter_test.go that check secrets do not leak"
condition = "AND"
regexTarget = "line"
paths = ['''^cmd/meiscope-collector/adapter_test\.go$''']
regexes = [
  '''^\s*"secret":\s*`\[\{"name":"a","adapter":"x","settings":\{"api_token":"abcdef123456"\}\}\]`,$''',
  '''^\s*for name, creds := range map\[string\]staticCreds\{"missing": \{\}, "short": \{"buffer_key": "c2VjcmV0LXNob3J0LXZhbHVl"\}, "not base64": \{"buffer_key": "!!secret-key-material!!"\}\} \{$''',
  '''^\s*for _, leak := range \[\]string\{"secret-key-material", "c2VjcmV0LXNob3J0LXZhbHVl", "secret-short-value"\} \{$''',
]

[[allowlists]]
description = "Synthetic Azure and Graph paging tokens (base64 of 'skiptoken-page1', 'skip-page-1', 'delta-token-1', 'delta-token-2') in hand-made adapter fixtures"
condition = "AND"
regexTarget = "line"
paths = ['''^testdata/adapters/azure/(keyvault|entra)/[a-z0-9-]+\.json$''']
regexes = [
  '''^\s*"(query|nextLink|@odata\.nextLink|@odata\.deltaLink)": "[^"]*\$(skiptoken|deltatoken)=(c2tpcHRva2VuLXBhZ2Ux|c2tpcC1wYWdlLTE|ZGVsdGEtdG9rZW4tMQ|ZGVsdGEtdG9rZW4tMg)",?$''',
]

[[allowlists]]
description = "ACM key-algorithm names (an enum, not a secret) in synthetic AWS fixtures of an earlier commit of WP1.2; generic-api-key matched \"KeyAlgorithm\": \"EC_prime256v1\""
condition = "AND"
regexTarget = "line"
paths = ['''^testdata/adapters/aws/synthetic-full/[0-9]{3}\.json$''']
regexes = [
  '''^\s*"KeyAlgorithm": "(RSA_(1024|2048|3072|4096)|EC_(prime256v1|secp384r1|secp521r1))",?$''',
]
