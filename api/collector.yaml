openapi: 3.1.0
info:
  title: Meiscope collector API
  version: 0.8.1
  description: |
    Collector surface of the Meiscope core (ADR-0005: REST over mTLS,
    additive-only within /v1). The public collector repository vendors a copy
    of this file.
    Every request is authenticated by the collector's mTLS client certificate,
    which identifies its tenant and collector record; no request body names a
    tenant.
    No schema in this file may carry private-key material (NFR-SEC-002):
    observations carry certificates, never keys.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /collector/v1
tags:
  - name: health
    description: Liveness
  - name: observations
    description: Observation submission
  - name: ct
    description: Inputs of Certificate Transparency ingestion
paths:
  /owned-domains:
    get:
      operationId: listCollectorOwnedDomains
      summary: The tenant's owned domains, for Certificate Transparency polling
      description: |
        The domains the CT poller queries issuance for (FR-DISC-020). Each
        domain covers itself and every name below it.
      tags: [ct]
      responses:
        "200":
          description: The owned domains, sorted by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnedDomainList"
        "401":
          description: The collector is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: The list could not be read; retry with backoff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /healthz:
    get:
      operationId: getCollectorHealthz
      summary: Liveness and build information of the collector surface
      tags: [health]
      responses:
        "200":
          description: The collector surface is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /observations:
    post:
      operationId: postObservations
      summary: Submit a batch of observations
      description: |
        Appends the observations and schedules their ingest. The body may be
        sent with `Content-Encoding: gzip` (recommended); at most 10 MiB on
        the wire and 64 MiB decompressed.
        Idempotent: an observation with the same target, method and
        observed_at as one already stored from this collector is counted as a
        duplicate and changes nothing, so a batch can be retried safely.
        Observations that fail validation are listed in `rejected`; the rest
        of the batch is still accepted.
      tags: [observations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationBatch"
      responses:
        "202":
          description: The batch was stored; accepted observations will be ingested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationBatchResult"
        "400":
          description: The body is not a valid observation batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The collector is not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The body exceeds the size limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Unsupported content type or content encoding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: |
            The tenant reached its ingest rate limit (observations per minute)
            or its daily observation quota (per UTC day). Nothing of the batch
            was stored; resubmit it unchanged after Retry-After seconds. The
            detail names the limit.
          headers:
            Retry-After:
              description: Seconds until the batch can be resubmitted.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: The batch could not be stored; retry with backoff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version, commit]
      properties:
        status:
          type: string
          enum: [ok]
          description: Always "ok" when the process can answer.
        version:
          type: string
          description: Semantic version of the core build, or "dev".
        commit:
          type: string
          description: Source commit of the core build, or "none".
    ObservationBatch:
      type: object
      additionalProperties: false
      required: [observations]
      properties:
        observations:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Observation"
    Observation:
      type: object
      additionalProperties: false
      description: One attempt to read a certificate from a target, with its outcome (FR-DISC-014).
      required: [target, method, observed_at, outcome]
      properties:
        target:
          $ref: "#/components/schemas/Target"
        method:
          type: string
          enum: [probe, adapter, ct, import]
          description: How the observation was made.
        observed_at:
          type: string
          format: date-time
          description: |
            When the attempt was made, by the collector's clock. At most five
            minutes ahead of the core's clock.
        outcome:
          type: string
          enum: [reached, refused, timeout, tls_failed, cert_seen]
          description: |
            reached: connected, no certificate offered; refused: connection
            refused; timeout: no answer; tls_failed: the TLS handshake failed;
            cert_seen: a certificate was served (served_chain is then required).
        served_chain:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            The certificates exactly as the target served them, leaf first,
            each DER-encoded and base64-encoded. Present exactly when outcome
            is cert_seen.
          items:
            type: string
            format: byte
            maxLength: 87384
        tls:
          $ref: "#/components/schemas/TLSParams"
        ct_entry:
          $ref: "#/components/schemas/CTEntry"
    CTEntry:
      type: object
      additionalProperties: false
      description: |
        Where a ct observation's certificate was found, stored as ct_entry
        evidence. Allowed with method ct only. The certificate itself (the
        logged certificate or precertificate, leaf first, then the chain the
        entry carried) is served_chain.
      required: [source]
      properties:
        source:
          type: string
          enum: [log, cert_spotter, crt_sh]
          description: A CT log read directly, or the Cert Spotter or crt.sh search service.
        log_id:
          type: string
          format: byte
          maxLength: 44
          description: The log's ID (SHA-256 of its public key, RFC 6962 §3.2), base64.
        entry_index:
          type: integer
          format: int64
          minimum: 0
          description: Index of the entry in the log.
        timestamp:
          type: string
          format: date-time
          description: The entry's timestamp (the SCT timestamp, RFC 6962 §3.2).
    Target:
      type: object
      additionalProperties: false
      required: [kind, host, port]
      properties:
        kind:
          type: string
          enum: [host_port_sni, ct_log]
          description: |
            Locator kind. host_port_sni: a network endpoint. ct_log: a
            Certificate Transparency log or search service that was read
            (method ct only, outcome cert_seen, no sni); every certificate
            read from it is its own target. Other kinds (file, store, cloud
            resource) are added additively.
        host:
          type: string
          minLength: 1
          maxLength: 253
          description: |
            Host name or IP address that was connected to; for ct_log the host
            name of the log or service (e.g. its API host).

            Metadata-only mode (NFR-DATA-004): when the tenant is in
            metadata-only mode, host (and sni) must be the hashed form
            "h1:" + base32(HMAC-SHA-256(key, canonical host)), where the
            base32 is RFC 4648 with the lower-case alphabet a-z2-7 and no
            padding (exactly 55 characters, pattern ^h1:[a-z2-7]{52}$, in
            canonical form: the 4 bits after the 256 hash bits are zero). The
            canonical host is an IP address in canonical text form (IPv4
            dotted decimal; IPv6 per RFC 5952, lower case) or a name in lower
            case without a trailing dot. key is the tenant's masking key, at
            least 32 random bytes, kept only in the collector configuration;
            the core never receives it. Observations with a host or sni not
            in this form are rejected with code invalid_target and a message
            starting "host_not_masked:". In full mode
            both clear and hashed hosts are accepted. Test vector: key
            000102...1f (the 32 bytes 0x00..0x1f), host "www.example.com" ->
            "h1:4qf5a2mrnovkwma6up63lma76w37xpkmkjff74co5s5eewiv7zbq".
        port:
          type: integer
          minimum: 1
          maximum: 65535
        sni:
          type: string
          maxLength: 253
          description: |
            Server name sent in the TLS ClientHello; empty or absent when none
            was sent. In metadata-only mode, the hashed form described under
            host (the hash of the name that was sent).
    TLSParams:
      type: object
      additionalProperties: false
      description: Negotiated connection parameters, stored as tls_params evidence.
      properties:
        version:
          type: string
          description: Negotiated protocol version, e.g. "TLS 1.3".
        cipher_suite:
          type: string
          description: Negotiated cipher suite name.
        alpn:
          type: string
          description: Negotiated ALPN protocol.
        ocsp_stapled:
          type: boolean
          description: Whether an OCSP response was stapled.
        protocol:
          type: string
          description: Application protocol, e.g. "https", "smtp-starttls", "ldaps".
        plugin:
          type: string
          description: Collector plugin that made the attempt.
    ObservationBatchResult:
      type: object
      additionalProperties: false
      required: [accepted, duplicates, rejected]
      properties:
        accepted:
          type: integer
          description: Observations stored by this request.
        duplicates:
          type: integer
          description: Observations already stored by an earlier request.
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/Rejection"
    Rejection:
      type: object
      additionalProperties: false
      required: [index, code, message]
      properties:
        index:
          type: integer
          description: Position of the observation in the batch.
        code:
          type: string
          description: |
            Why the observation was refused. The set of codes grows
            (x-extensible-enum): a client must accept a code it does not
            know, count the observation as rejected and not resend it.
          x-extensible-enum:
            - invalid_target
            - invalid_method
            - invalid_outcome
            - invalid_observed_at
            - observed_at_in_future
            - invalid_served_chain
            - chain_outcome_mismatch
            - invalid_ct_entry
        message:
          type: string
    OwnedDomainList:
      type: object
      additionalProperties: false
      required: [domains]
      properties:
        domains:
          type: array
          items:
            type: string
            description: A domain name, lower case, without a trailing dot.
    Problem:
      type: object
      description: Error body (RFC 9457 problem details, subset).
      required: [title, status]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
