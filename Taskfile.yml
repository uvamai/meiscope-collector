# Task runner for meiscope-collector (https://taskfile.dev, task v3.54.0).
version: "3"

vars:
  BINARY: meiscope-collector
  PKG: github.com/uvamai/meiscope-collector
  # Semantic version without the leading "v"; falls back when there is no tag.
  VERSION:
    sh: 'v="$(git describe --tags --abbrev=0 2>/dev/null)" && echo "${v#v}" || echo 0.0.0-dev'
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  LDFLAGS: -s -w -X {{.PKG}}/internal/platform.Version={{.VERSION}} -X {{.PKG}}/internal/platform.Commit={{.COMMIT}}
  # -race needs cgo; it runs in CI (Linux) and is skipped where no C compiler exists.
  RACE:
    sh: '[ "$(go env CGO_ENABLED)" = "1" ] && echo -race || echo'
  GO_WANT: go1.27.3

tasks:
  default:
    cmds:
      - task --list

  hooks:
    desc: Install the pre-push guard (refuses pushes to main and force-pushes) in this clone and its worktrees
    cmds:
      - sh scripts/git-hooks/install.sh

  build:
    desc: Build linux/amd64, linux/arm64 and windows/amd64 into bin/<os>_<arch>/, plus a host binary in bin/
    deps:
      - { task: build:target, vars: { GOOS: linux, GOARCH: amd64 } }
      - { task: build:target, vars: { GOOS: linux, GOARCH: arm64 } }
      - { task: build:target, vars: { GOOS: windows, GOARCH: amd64 } }
      - build:host

  build:target:
    internal: true
    vars:
      EXT: '{{if eq .GOOS "windows"}}.exe{{end}}'
    env:
      GOOS: "{{.GOOS}}"
      GOARCH: "{{.GOARCH}}"
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/{{.GOOS}}_{{.GOARCH}}/{{.BINARY}}{{.EXT}} ./cmd/{{.BINARY}}

  build:dev:
    desc: Development build with the devcredentials tag (environment-variable credentials); never ship it
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -tags devcredentials -ldflags "{{.LDFLAGS}}" -o bin/dev/{{.BINARY}}{{exeExt}} ./cmd/{{.BINARY}}

  build:host:
    desc: Build for the current machine into bin/meiscope-collector[.exe]
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/{{.BINARY}}{{exeExt}} ./cmd/{{.BINARY}}

  test:
    desc: Unit tests with coverage (with -race where cgo is available); built with the devcredentials tag so tests can use the development credential source
    cmds:
      - go test -tags devcredentials {{.RACE}} -cover ./...

  test:integration:
    desc: Docker integration tests (osquery 5.12.1, Squid proxy, Fleet); sets MEISCOPE_DOCKER_TESTS=1
    env:
      MEISCOPE_DOCKER_TESTS: "1"
    cmds:
      - go test -tags devcredentials -count=1 -v -run "Integration|TestSquidProxy" ./...

  test:zoo:
    desc: Probe tests against the TLS zoo (Docker; test/zoo/compose.yml, images pinned by digest)
    env:
      MEISCOPE_ZOO: "1"
    cmds:
      - go run ./test/zoo/gen test/zoo/certs
      - defer: docker compose -f test/zoo/compose.yml down -v
      - docker compose -f test/zoo/compose.yml up -d
      # docker-mailserver starts Postfix and Dovecot only once an account exists;
      # the throwaway password is random and never used (the probe never logs in).
      - |
        for i in $(seq 1 60); do docker compose -f test/zoo/compose.yml exec -T mail true 2>/dev/null && break; sleep 2; done
        docker compose -f test/zoo/compose.yml exec -T mail setup email add zoo@zoo.example.test "$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
      - go test -tags zoo -count=1 -v ./test/zoo/

  test:policy:
    desc: ScanPolicy pacer property tests (PENDING - human engineer, issue 13)
    cmds:
      - echo "::warning title=ScanPolicy property tests PENDING::The pacer property tests are not written yet and wait for a human engineer. Nothing is tested by this job. See https://github.com/uvamai/meiscope-collector/issues/13"
      - echo "PENDING - ScanPolicy pacer property tests need a human engineer - https://github.com/uvamai/meiscope-collector/issues/13"

  lint:
    desc: go vet, golangci-lint and gofumpt
    cmds:
      - go vet ./...
      - golangci-lint run ./...
      - golangci-lint run --build-tags devcredentials ./...
      - cmd: |
          out="$(gofumpt -l .)"
          if [ -n "$out" ]; then echo "gofumpt would reformat:"; echo "$out"; exit 1; fi

  package:
    desc: Build deb and rpm packages for linux/amd64 and linux/arm64 into dist/ (nFPM)
    deps:
      - { task: build:target, vars: { GOOS: linux, GOARCH: amd64 } }
      - { task: build:target, vars: { GOOS: linux, GOARCH: arm64 } }
    cmds:
      - for: [deb, rpm]
        task: package:one
        vars: { PACKAGER: "{{.ITEM}}", GOARCH: amd64 }
      - for: [deb, rpm]
        task: package:one
        vars: { PACKAGER: "{{.ITEM}}", GOARCH: arm64 }

  package:one:
    internal: true
    env:
      GOARCH: "{{.GOARCH}}"
      VERSION: "{{.VERSION}}"
    cmds:
      - mkdir -p dist/.stage
      - cp bin/linux_{{.GOARCH}}/{{.BINARY}} dist/.stage/{{.BINARY}}
      - nfpm package --config packaging/nfpm.yaml --packager {{.PACKAGER}} --target dist/

  contract:diff:
    desc: "Compare the vendored contract with a core's collector.yaml and validate collector output against it: task contract:diff CORE=<path>"
    requires:
      vars: [CORE]
    cmds:
      - sh scripts/contract-diff.sh "{{.CORE}}"

  contract:proposal:
    desc: oasdiff breaking-change check of the proposed contract against the vendored 0.8.1 file
    cmds:
      - oasdiff breaking --flatten-allof api/collector.yaml api/proposed/collector-0.5.0-proposed.yaml --fail-on ERR

  clean:
    desc: Remove build and package output
    cmds:
      - rm -rf bin dist

  doctor:
    desc: Check the toolchain this repository needs, at the versions pinned in meiscope third_party/DEPENDENCIES.md §5
    silent: true
    cmds:
      - cmd: |
          fail=0
          check() {
            name="$1"; want="$2"; got="$3"
            case "$got" in
              *"$want"*) echo "ok    $name ($want)" ;;
              *) echo "FAIL  $name: want $want, got: $got"; fail=1 ;;
            esac
          }
          check go            "{{.GO_WANT}}" "$(go env GOVERSION 2>&1 || true)"
          check task          "3.54.0"   "$(task --version 2>&1 || true)"
          check golangci-lint "2.15.0"   "$(golangci-lint version 2>&1 || true)"
          check gofumpt       "v0.12.0"  "$(gofumpt --version 2>&1 || true)"
          check nfpm          "2.48.0"   "$(nfpm --version 2>&1 || true)"
          check cosign        "v3.1.4"   "$(cosign version 2>&1 || true)"
          check syft          "1.55.0"   "$(syft version 2>&1 || true)"
          if [ "$fail" -ne 0 ]; then echo "doctor: some tools are missing or at the wrong version"; exit 1; fi
          echo "doctor: all green"
