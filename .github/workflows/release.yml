# Release of the public collector from a protected v* tag (cicd-pipeline.md
# sections 1 and 5, ADR-0015): binaries, nFPM deb/rpm, CycloneDX SBOM, cosign
# keyless signatures, build provenance, GitHub release, and the container
# image ghcr.io/uvamai/meiscope-collector (linux/amd64 and linux/arm64,
# cosign-signed by digest, CycloneDX SBOM attestation).
# Actions are pinned by commit SHA; the tag is in the comment.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GO_VERSION: "1.27.4"
  TASK_VERSION: "3.54.0"
  NFPM_VERSION: v2.48.0
  COSIGN_VERSION: v3.1.4
  SYFT_VERSION: v1.55.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the Taskfile derives VERSION from the tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - name: Install nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}
      - name: Build binaries and packages
        run: |
          task build
          task package
      - name: Collect release files
        run: |
          mkdir -p release
          cp bin/linux_amd64/meiscope-collector       release/meiscope-collector_linux_amd64
          cp bin/linux_arm64/meiscope-collector       release/meiscope-collector_linux_arm64
          cp bin/windows_amd64/meiscope-collector.exe release/meiscope-collector_windows_amd64.exe
          cp dist/*.deb dist/*.rpm release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-unsigned
          path: release/
          if-no-files-found: error

  authenticode:
    name: Windows Authenticode
    needs: [build]
    runs-on: windows-latest
    steps:
      - name: Authenticode certificate not available
        if: vars.AUTHENTICODE_ENABLED != 'true'
        shell: bash
        run: |
          echo "::warning title=Authenticode skipped::The Windows binary is NOT Authenticode-signed. The code-signing certificate does not exist yet (open-questions D-03). Set repository variable AUTHENTICODE_ENABLED=true once it does."
          echo "### Authenticode skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "The Windows binary in this release is not Authenticode-signed (no certificate yet)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: vars.AUTHENTICODE_ENABLED == 'true'
        with:
          name: release-unsigned
          path: release/
      - name: Sign with Authenticode (RFC 3161 timestamp)
        if: vars.AUTHENTICODE_ENABLED == 'true'
        shell: bash
        run: |
          # To be implemented with the certificate (WP0.1 skeleton): signtool sign
          # /fd sha256 /tr <RFC 3161 TSA> /td sha256 release/meiscope-collector_windows_amd64.exe
          echo "::error::Authenticode signing is enabled but not implemented yet."
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: vars.AUTHENTICODE_ENABLED == 'true'
        with:
          name: release-authenticode
          path: release/meiscope-collector_windows_amd64.exe

  publish:
    needs: [build, authenticode]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # GitHub release
      id-token: write # cosign keyless and attestations (GitHub OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-unsigned
          path: release/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: vars.AUTHENTICODE_ENABLED == 'true'
        with:
          name: release-authenticode
          path: release/
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          syft-version: ${{ env.SYFT_VERSION }}
          output-file: release/meiscope-collector.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign (cosign keyless)
        working-directory: release
        run: |
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/meiscope-collector_*
            release/*.deb
            release/*.rpm
      - name: Signed apt/yum repositories not published yet
        run: echo "::notice title=Package repositories::GPG-signed apt/yum repository publishing is not set up yet; packages are attached to the GitHub release only."
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  image:
    name: container image
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write # ghcr.io/uvamai/meiscope-collector
      id-token: write # cosign keyless (GitHub OIDC)
    env:
      IMAGE: ghcr.io/uvamai/meiscope-collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push one image per platform, then the multi-arch index
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          refs=()
          for arch in amd64 arm64; do
            # The default docker driver builds one platform at a time; the
            # build stage cross-compiles on amd64 (deploy/Dockerfile).
            docker buildx build --platform "linux/$arch" -f deploy/Dockerfile \
              --build-arg VERSION="$version" --build-arg COMMIT="$GITHUB_SHA" \
              --build-arg TARGETOS=linux --build-arg TARGETARCH="$arch" \
              --provenance=false --sbom=false \
              --metadata-file "$RUNNER_TEMP/meta-$arch.json" \
              -t "$IMAGE:$GITHUB_REF_NAME-$arch" --push .
            digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta-$arch.json")"
            case "$digest" in sha256:*) ;; *) echo "::error::no digest for linux/$arch"; exit 1 ;; esac
            refs+=("$IMAGE@$digest")
          done
          docker buildx imagetools create -t "$IMAGE:$GITHUB_REF_NAME" "${refs[@]}"
          index="$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$index" in sha256:*) ;; *) echo "::error::no digest for the index"; exit 1 ;; esac
          echo "REF=$IMAGE@$index" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: cosign sign (keyless, GitHub OIDC)
        run: cosign sign --yes --recursive "$REF"
      - name: SBOM of the image (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REF }}
          format: cyclonedx-json
          syft-version: ${{ env.SYFT_VERSION }}
          output-file: ${{ runner.temp }}/image.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attach the SBOM as a signed attestation (keyless)
        run: cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/image.cdx.json" "$REF"
      - name: Summary
        run: |
          {
            echo "### Container image"
            echo
            echo "Deploy by digest: \`$REF\`"
            echo
            echo "Verify: \`cosign verify --certificate-identity-regexp '^https://github\\.com/uvamai/meiscope-collector/\\.github/workflows/release\\.yml@refs/tags/v' --certificate-oidc-issuer https://token.actions.githubusercontent.com $REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
