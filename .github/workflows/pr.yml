# Pull-request checks for the public collector (cicd-pipeline.md section 1).
# Actions are pinned by commit SHA (ADR-0015); the tag is in the comment.
name: pr

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GO_VERSION: "1.27.4"
  TASK_VERSION: "3.54.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: golangci-lint with the development tag
        run: golangci-lint run --build-tags devcredentials ./...
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          out="$(gofumpt -l .)"
          if [ -n "$out" ]; then echo "gofumpt would reformat:"; echo "$out"; exit 1; fi

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race -tags devcredentials -coverprofile=coverage.out ./...
      - name: release tags (no development credential source)
        run: go test -race ./...

  zoo:
    name: probe plugins (TLS zoo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      # Packet capture of the zoo scan: after the server certificate the
      # probe's client sends nothing but one alert (internal/wirecheck).
      - name: start packet capture
        run: |
          sudo tcpdump -i lo -U -s 0 -w "$RUNNER_TEMP/zoo.pcap" 'tcp portrange 10000-15999' >/dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/tcpdump.pid"
          sleep 2
      - run: task test:zoo
      - name: check the packet capture
        if: always()
        run: |
          sudo kill -INT "$(cat "$RUNNER_TEMP/tcpdump.pid")" && sleep 2
          sudo chmod a+r "$RUNNER_TEMP/zoo.pcap"
          go run ./test/zoo/pcapcheck -min-tls 12 "$RUNNER_TEMP/zoo.pcap" 15432 15433 13306 10389 10636 10025 10587 10465 10143 10993 10110 10995 13389 10999
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zoo-packet-capture
          path: ${{ runner.temp }}/zoo.pcap
          retention-days: 14

  policy:
    # PENDING: the pacer property tests wait for a human engineer (founder
    # decision 2 Nov 2026; issue #13). This job does not test anything yet;
    # it says so in the run summary rather than passing silently.
    name: scanpolicy property tests (PENDING — human engineer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - run: task test:policy

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  build:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - run: task build
      - run: ./bin/meiscope-collector version
      # The container image as release.yml builds it, both platforms, not pushed.
      - name: Container image (linux/amd64, linux/arm64)
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" -f deploy/Dockerfile \
              --build-arg TARGETOS=linux --build-arg TARGETARCH="$arch" \
              --provenance=false --sbom=false -t "meiscope-collector:pr-$arch" .
          done
          docker run --rm meiscope-collector:pr-amd64 version

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan the commits in this change
        env:
          GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
            range="$BEFORE_SHA..$PUSH_SHA"
          else
            range="$PUSH_SHA"
          fi
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git /repo --config /repo/.gitleaks.toml \
            --log-opts="$range" --redact --no-banner --verbose

  tracked-keystores:
    name: no tracked keystores
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The public collector tracks no keystore or key file at all.
      - run: .github/scripts/check-tracked-keystores.sh

  no-uvam-ai:
    name: no UVAMAI hostname
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The product uses meiscope.cloud; tests use reserved names (WP0.10).
      - run: sh .github/scripts/check-no-uvam-ai.sh
