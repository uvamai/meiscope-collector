# Runs the Meiscope osquery pack's Windows queries on a real Windows runner
# (WP1.1 acceptance: "the pack runs on a Windows Server 2022 host"; the
# runner image is windows-2025). It installs osquery 5.12.1 from the official
# release zip without a system-wide install, creates a self-signed test
# certificate in LocalMachine\My and a .pfx in an included path (both
# generated in the job, test-only, removed at the end), runs the pack's
# Windows queries through osqueryi as the runner's administrator, and checks
# the rows and their ingestion into the fake core.
#
# STATUS: first run on 2026-11-01 (PR #3): the osqueryi call for the first
# query never returned and the job hit its 30-minute limit. Each query now has
# a 180 s limit and keeps its stderr so the next run names the cause.
# Actions are pinned by commit SHA (ADR-0015); the tag is in the comment.
name: windows-osquery

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "packs/**"
      - "internal/adapter/**"
      - ".github/workflows/windows-osquery.yml"

permissions:
  contents: read

concurrency:
  group: windows-osquery-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GO_VERSION: "1.27.3"
  OSQUERY_VERSION: "5.12.1"
  OSQUERY_URL: https://github.com/osquery/osquery/releases/download/5.12.1/osquery-5.12.1.windows_x86_64.zip
  # osquery publishes no SHA-256 for this release. This value is the hash of
  # the release asset as downloaded on 2026-10-25 (trust on first use) and
  # must be confirmed against an osquery-published source by a maintainer.
  OSQUERY_ZIP_SHA256: 45AB01C1B413165F3836313EA9FF8AC9CB293D41F3DB0B4D0E390FA1D6370A6D

jobs:
  pack:
    name: pack queries on Windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install osquery from the release zip (no system-wide install)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "osquery.zip"
          Invoke-WebRequest -Uri $env:OSQUERY_URL -OutFile $zip -UseBasicParsing
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($hash -ne $env:OSQUERY_ZIP_SHA256) { throw "osquery zip hash $hash does not match the pinned value" }
          $dest = Join-Path $env:RUNNER_TEMP "osquery"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $exe = Get-ChildItem $dest -Recurse -Filter osqueryi.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($sig.Status -ne 'Valid') { throw "osqueryi.exe signature is $($sig.Status)" }
          "OSQUERYI=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $exe.FullName --version

      - name: Create the test certificate and keystore (test-only, generated here)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Subject "CN=web01.example.test" -DnsName "web01.example.test" `
            -CertStoreLocation "Cert:\LocalMachine\My" -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(30)
          "CERT_THUMBPRINT=$($cert.Thumbprint.ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Inside the programdata_ssl root, at depth 2.
          if (-not (Test-Path "C:\ProgramData\ssl")) { "CREATED_SSL_ROOT=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          $dir = "C:\ProgramData\ssl\meiscope-ci"
          New-Item -ItemType Directory -Force $dir | Out-Null
          # Decoys that must NOT be reported: one at depth 5 (below the depth
          # limit) and one outside every root.
          $deep = "$dir\a\b\c\d"
          New-Item -ItemType Directory -Force $deep, "C:\ProgramData\MeiscopeCiOutside" | Out-Null
          Set-Content -Path "$deep\deep.pem" -Value "decoy" -Encoding ascii
          Set-Content -Path "C:\ProgramData\MeiscopeCiOutside\outside.pem" -Value "decoy" -Encoding ascii
          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $pwText = [Convert]::ToBase64String($bytes)
          "::add-mask::$pwText"
          "PFX_PASSWORD=$pwText" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $pw = ConvertTo-SecureString -String $pwText -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath "$dir\web01.pfx" -Password $pw | Out-Null
          Get-Item "$dir\web01.pfx" | Select-Object FullName, Length

      - name: Run the pack's Windows queries through osqueryi
        shell: pwsh
        timeout-minutes: 15
        run: |
          go build -o "$env:RUNNER_TEMP\collector.exe" ./cmd/meiscope-collector
          $out = Join-Path $env:RUNNER_TEMP "osq-out"
          New-Item -ItemType Directory -Force $out | Out-Null
          $queries = & "$env:RUNNER_TEMP\collector.exe" adapter pack --list | ForEach-Object { ($_ -split "`t")[0] } | Where-Object { $_ -like "*_windows*" }
          $elapsed = @{}
          foreach ($q in $queries) {
            $sql = & "$env:RUNNER_TEMP\collector.exe" adapter pack --query $q
            if ($LASTEXITCODE -ne 0) { throw "adapter pack --query $q failed" }
            # The SQL goes in on stdin from a file, so nothing waits on the runner's
            # console. Each query has its own time limit and keeps its stderr, so a
            # slow or stuck query is named in the log instead of using the whole job.
            $sqlFile = Join-Path $out "$q.sql"
            $stdout = Join-Path $out "web01-$q.json"
            $stderr = Join-Path $out "$q.stderr.txt"
            Set-Content -Path $sqlFile -Value ($sql -join " ") -Encoding ascii
            $clock = [System.Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $env:OSQUERYI -ArgumentList "--json", "--verbose" `
              -RedirectStandardInput $sqlFile -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
              -NoNewWindow -PassThru
            $done = $p.WaitForExit(180000)
            if (-not $done) {
              Stop-Process -Id $p.Id -Force
              Write-Host "::group::osqueryi stderr for $q (killed after 180 s)"
              Get-Content $stderr -Tail 60 | Write-Host
              Write-Host "::endgroup::"
              throw "osqueryi did not finish $q within 180 s"
            }
            $elapsed[$q] = $clock.Elapsed.TotalSeconds
            Write-Host "$q finished in $([int]$clock.Elapsed.TotalSeconds) s with exit code $($p.ExitCode)"
            if ($p.ExitCode -ne 0) {
              Get-Content $stderr -Tail 60 | Write-Host
              throw "osqueryi failed for $q"
            }
          }
          Get-ChildItem $out -Filter *.json | Select-Object Name, Length
          # Per-root report: files seen, skipped, and the time of both queries.
          $rows = foreach ($q in $queries | Where-Object { $_ -like "meiscope_keystore_counts_windows_*" }) {
            $root = $q.Substring("meiscope_keystore_counts_windows_".Length)
            $c = (Get-Content (Join-Path $out "web01-$q.json") -Raw | ConvertFrom-Json) | Select-Object -First 1
            $secs = $elapsed[$q] + $elapsed["meiscope_keystores_windows_$root"]
            "| $root | $([int]$c.excluded + [int]$c.oversize + [int]$c.eligible) | $($c.oversize) | $([Math]::Max(0, [int]$c.eligible - 1000)) | $($c.excluded) | $([Math]::Round($secs, 1)) s |"
          }
          $table = @("| root | files seen | skipped oversize | skipped limit | skipped excluded | elapsed |", "|---|---|---|---|---|---|") + $rows
          $table | Write-Host
          $table | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "OSQUERY_WINDOWS_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Assert the rows and their ingestion into the fake core
        shell: pwsh
        env:
          MEISCOPE_WINDOWS_OSQUERY_DIR: ${{ env.OSQUERY_WINDOWS_DIR }}
          MEISCOPE_WINDOWS_CERT_THUMBPRINT: ${{ env.CERT_THUMBPRINT }}
          MEISCOPE_WINDOWS_PFX_PATH: C:\ProgramData\ssl\meiscope-ci\web01.pfx
          MEISCOPE_WINDOWS_DECOYS: C:\ProgramData\ssl\meiscope-ci\a\b\c\d\deep.pem,C:\ProgramData\MeiscopeCiOutside\outside.pem
          MEISCOPE_WINDOWS_PFX_PASSWORD: ${{ env.PFX_PASSWORD }}
        run: go test -tags devcredentials -count=1 -v -run TestWindowsPackRun ./internal/adapter/osquery/

      - name: Remove the test certificate and keystore
        if: always()
        shell: pwsh
        run: |
          if ($env:CERT_THUMBPRINT) { Remove-Item "Cert:\LocalMachine\My\$($env:CERT_THUMBPRINT)" -ErrorAction SilentlyContinue }
          Remove-Item -Recurse -Force "C:\ProgramData\ssl\meiscope-ci", "C:\ProgramData\MeiscopeCiOutside" -ErrorAction SilentlyContinue
          if ($env:CREATED_SSL_ROOT -eq "1") { Remove-Item -Force "C:\ProgramData\ssl" -ErrorAction SilentlyContinue }
